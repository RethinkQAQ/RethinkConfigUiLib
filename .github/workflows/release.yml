name: Release Mod Template

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-mods.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/combined-artifacts/*.jar

