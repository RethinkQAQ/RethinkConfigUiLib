name: Reusable Minecraft build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ''
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set build version
        id: version
        shell: bash
        run: |
          build_version="$(grep '^mod.version=' gradle.properties | cut -d= -f2-)"
          [[ -n "$build_version" ]] || { echo "mod.version is missing" >&2; exit 1; }
          [[ "$build_version" != v* ]] || { echo "mod.version must not include the Git tag v prefix" >&2; exit 1; }
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          if [[ "${{ inputs.release }}" == "true" ]]; then
            echo "BUILD_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "BUILD_SUFFIX=build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          if [[ "${{ inputs.release }}" == "true" && -n "${{ inputs.release_tag }}" ]]; then
            [[ "${{ inputs.release_tag }}" == v* ]] || { echo "release_tag must be a Git tag such as v0.7.4" >&2; exit 1; }
          fi
          echo "artifact_name=mod-jars-staging" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        run: ./gradlew validateVersionProperties --no-daemon --stacktrace

      - name: Check license headers
        run: ./gradlew licenseCheck --no-daemon --stacktrace

      - name: Build all enabled targets
        run: >-
          ./gradlew build collectPlatformJars verifyPlatformJars generateReleaseManifest
          -Pmod.version="$BUILD_VERSION"
          -Pbuild.number="$BUILD_SUFFIX"
          -Prelease.tag="${{ inputs.release_tag }}"
          --parallel --build-cache --no-daemon --stacktrace

      - name: Collect platform jars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          combined = Path('platform-artifacts')
          combined.mkdir(exist_ok=True)
          jars = sorted(Path('build/platform-jars').glob('rethink-config-ui-lib-*-*.jar'))
          if not jars:
              raise SystemExit('No platform jars were generated')
          for jar in jars:
              if any(token in jar.name for token in ('-sources.jar', '-javadoc.jar', '-dev.jar', '-slim.jar', '-all-all.jar')):
                  raise SystemExit(f'Non-release jar found in platform output: {jar.name}')
              target = combined / jar.name
              target.write_bytes(jar.read_bytes())
          release = Path('build/release')
          for item in release.glob('*'):
              (combined / item.name).write_bytes(item.read_bytes())
          PY

      - name: Upload commit artifact
        if: inputs.release != true
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: platform-artifacts/**
          if-no-files-found: error

      - name: Upload release staging artifact
        if: inputs.release == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: platform-artifacts/**
          if-no-files-found: error
