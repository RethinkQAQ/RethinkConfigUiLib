name: Reusable Minecraft build

on:
  workflow_call:
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "BUILD_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=$(grep '^mod.version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
            echo "BUILD_SUFFIX=build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "artifact_name=mod-jars-staging" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        run: ./gradlew validateVersionProperties --no-daemon --stacktrace

      - name: Check license headers
        run: ./gradlew licenseCheck --no-daemon --stacktrace

      - name: Build all enabled targets
        run: >-
          ./gradlew build assembleUniversalJars
          -Pmod.version="$BUILD_VERSION"
          -Pbuild.number="$BUILD_SUFFIX"
          --parallel --build-cache --no-daemon --stacktrace

      - name: Collect universal jars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          combined = Path('combined-artifacts')
          combined.mkdir(exist_ok=True)
          jars = sorted(Path('build/libs').glob('rethink-config-ui-lib-*-mc*.jar'))
          if not jars:
              raise SystemExit('No universal jars were generated')
          for jar in jars:
              if any(jar.name.endswith(f'-{loader}.jar') for loader in ('fabric', 'forge', 'neoforge')):
                  raise SystemExit(f'Platform jar found in universal output: {jar.name}')
              if any(token in jar.name for token in ('-sources.jar', '-javadoc.jar', '-dev.jar')):
                  raise SystemExit(f'Non-release jar found in universal output: {jar.name}')
              published_name = jar.name
              if published_name.endswith('-slim-all.jar'):
                  published_name = published_name[:-len('-slim-all.jar')] + '.jar'
              elif published_name.endswith('-slim.jar'):
                  published_name = published_name[:-len('-slim.jar')] + '.jar'
              (combined / published_name).write_bytes(jar.read_bytes())
          PY

      - name: Upload commit artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: combined-artifacts/*.jar
          if-no-files-found: error

      - name: Upload release staging artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: combined-artifacts/*.jar
          if-no-files-found: error
