modLoader="javafml"
# This version range applies to the JavaFML language provider, not NeoForge.
# NeoForge 1.21.1 exposes JavaFML 4.x while its own version is 21.1.x.
loaderVersion="[1,)"
license="${modLicense}"
issueTrackerURL="https://github.com/${modGitHub}/issues"

[[mods]]
modId="${modId}"
version="${modVersion}"
displayName="${modName}"
iconFile="assets/rethink_config_ui_lib/icon.png"
authors="${modAuthor}"
description='''${modDescription}'''
displayURL="https://github.com/${modGitHub}"

[[dependencies.${modId}]]
modId="neoforge"
type="required"
versionRange="[${neoForgeMinVersion},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modId}]]
modId="minecraft"
type="required"
versionRange="${minecraftVersionRangeNeoForge}"
ordering="NONE"
side="CLIENT"
